# StatefulSet for PostgreSQL
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pulseops-postgres
  labels:
    app: pulseops-postgres
spec:
  serviceName: pulseops-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: pulseops-postgres
  template:
    metadata:
      labels:
        app: pulseops-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          # 1. Non-secret environment variables loaded from ConfigMap
          envFrom:
            - configMapRef:
                name: pulseops-postgres-config
          # 2. Secret password loaded from Secret object
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulseops-db-secret
                  key: password
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "do-block-storage"
        resources:
          requests:
            storage: 5Gi
