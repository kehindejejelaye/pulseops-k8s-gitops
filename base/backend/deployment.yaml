apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulseops-backend
  labels:
    app: pulseops-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulseops-backend
  template:
    metadata:
      labels:
        app: pulseops-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/kehindejejelaye/pulseops-backend:latest
          ports:
            - containerPort: 5000
              name: http
          # 1. Non-secret environment variables loaded from ConfigMap
          envFrom:
            - configMapRef:
                name: pulseops-backend-config
          # 2. Secret environment variables loaded from Secret
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulseops-db-secret
                  key: password
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
