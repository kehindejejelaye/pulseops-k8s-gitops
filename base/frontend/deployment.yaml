apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulseops-frontend
  labels:
    app: pulseops-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulseops-frontend
  template:
    metadata:
      labels:
        app: pulseops-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/kehindejejelaye/pulseops-frontend:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"      # 0.05 CPU core
              memory: "64Mi"  # 64MB RAM
            limits:
              cpu: "150m"     # 0.15 CPU core
              memory: "128Mi" # 128MB RAM
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
