# ExternalSecret defines WHAT secret to fetch from the external vault
# and WHAT Kubernetes Secret to generate in the cluster.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pulseops-db-external-secret
  namespace: dev
spec:
  refreshInterval: 168h # Automatically polls and rotates secret every 168 hour
  secretStoreRef:
    name: pulseops-secret-store
    kind: SecretStore
  target:
    name: pulseops-db-secret # Automatically generates the K8s Secret expected by Backend & Postgres!
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: PULSEOPS_DB_PASSWORD
