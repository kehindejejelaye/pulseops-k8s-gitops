apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - namespace.yaml
  - ingress.yaml
  - ../../base

# In dev, we patch replicas down to 1 each to save cloud CPU and memory
patches:
  - target:
      kind: Deployment
      name: pulseops-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: pulseops-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

# Overrides image tags with the images published to GHCR from the 'dev' branch
images:
  - name: ghcr.io/kehindejejelaye/pulseops-backend
    newTag: dev
  - name: ghcr.io/kehindejejelaye/pulseops-frontend
    newTag: dev
