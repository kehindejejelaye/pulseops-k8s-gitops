# External Secrets Operator (ESO) - SecretStore definition
# A SecretStore tells Kubernetes WHERE your external secrets are hosted.
# It can connect to Doppler (free), HashiCorp Vault, AWS Secrets Manager, GCP Secret Manager, etc.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: pulseops-secret-store
  namespace: dev
spec:
  provider:
    # Example using Doppler (popular zero-cost cloud secrets manager with an official ESO provider)
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token-secret
            key: dopplerToken
